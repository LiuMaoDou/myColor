services:
  db:
    image: postgres:17-alpine
    container_name: color-atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: color_atlas
    ports:
      - "127.0.0.1:54339:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d color_atlas"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  atlas_pgdata:
